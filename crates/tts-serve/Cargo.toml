[package]
name = "tts-serve"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "tts-serve"
path = "src/main.rs"

[dependencies]
tts-core = { path = "../tts-core" }
tts-engines = { path = "../tts-engines" }
anyhow = { workspace = true }
clap = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["metal"]
metal = ["tts-engines/metal", "tts-core/metal"]
