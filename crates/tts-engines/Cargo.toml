[package]
name = "tts-engines"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
tts-core = { path = "../tts-core", default-features = false }
audio8 = { path = "../audio8", default-features = false }
cosyvoice = { path = "../cosyvoice", default-features = false }
qwen3tts = { path = "../qwen3tts", default-features = false }

[features]
default = ["metal"]
metal = ["audio8/metal", "cosyvoice/metal", "qwen3tts/metal", "tts-core/metal"]
